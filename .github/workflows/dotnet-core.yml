name: .NET Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # See https://learn.microsoft.com/en-us/lifecycle/products/microsoft-net-and-net-core
        # and https://github.com/dotnet/core/blob/main/releases.md
        # for versions
        include:
          - dotnet-version: 8.0.x
            framework: net8.0
          - dotnet-version: 9.0.x
            framework: net9.0
          - dotnet-version: 10.0.x
            framework: net10.0

    continue-on-error: true

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Setup latest version of dotnet
      uses: actions/setup-dotnet@v5
    - name: Build with latest version
      run: dotnet build --warnaserror Aspose.BarCode.Cloud.Sdk.sln

    - name: Setup ${{ matrix.dotnet-version }} version of dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Test with ${{ matrix.dotnet-version }}
      run: dotnet test --verbosity normal --framework ${{ matrix.framework }}
      env:
        TEST_CONFIGURATION_JWT_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

  coverage:
    name: Library coverage
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Test with library coverage threshold
      run: make cover
      env:
        TEST_CONFIGURATION_JWT_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage/coverage-badge.json
          coverage/coverage-summary.json
          coverage/coverage.*.cobertura.xml

  publish-coverage:
    name: Publish coverage
    needs: coverage
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_CLIENT_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: coverage
        path: coverage
    - name: Get a token for the test-coverage repository
      id: coverage-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.COVERAGE_APP_CLIENT_ID }}
        private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
        owner: aspose-barcode-cloud
        repositories: test-coverage
        permission-contents: write
    - name: Publish to test-coverage
      run: python scripts/publish-coverage.py dotnet
      env:
        COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
        COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
